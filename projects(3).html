<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Alexander Antyufeev | GGen Portoflio</title>

    <style>
        body {
            margin: 0;
            font-family: Montserrat, Arial, sans-serif;
            background-image: url('https://i.imgur.com/IEd1BUi.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        /* Шапка */
        header {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.40);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 15px;
        }

        .button {
            text-decoration: none;
            color: white;
            background: #4CAF50; /* Гармоничный зеленый */
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .button:hover {
            background: #c98e44; /* Контрастный оранжевый */
            transform: scale(1.05);
        }

        /* Контент */
        .content {
            text-align: center;
            margin-top: 80px;
            padding: 0 20px;
            color: #ff9800;
        }

        .content h1 {
            font-size: 60px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }

        .p1 {
            font-size: 24px;
            color: #ff9800;
            margin-bottom: 50px;
            font-family: Georgia, serif;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Блок видео */
        .video-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding-bottom: 80px;
        }

        /* Карточка видео */
        .video-card {
            background: rgba(0, 0, 0, 0.45);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-card h2 {
            color: white;
            margin-bottom: 15px;
            font-size: 20px;
        }

        video {
            width: 500px;
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

    <!-- Шапка -->
    <header>
        <div class="logo">
            Alexander Antyufeev | GGenman
        </div>

        <div class="menu">
            <a href="index.html" class="button">Главная</a>
            <a href="contacts(4).html" class="button">Контакты</a>
            <a href="paybuy(5).html" class="button">Заказ</a>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="content">

        <h1>Мои проекты</h1>
        <p class="p1">Здесь вы можете ознакомиться с моим портфолио</p>

        <!-- Галерея видео -->
        <div class="video-gallery">

            <!-- Видео 1 -->
            <div class="video-card">
                <h2>КИПФИН_825ИСиП</h2>
                <video controls>
                    <source src="R2.mp4" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            </div>

            <!-- Видео 2 -->
            <div class="video-card">
                <h2>Портфолио | YouTube Shorts</h2>
                <video controls>
                    <source src="R1.mp4" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            </div>

            <!-- Видео 3 -->
            <div class="video-card">
                <h2>Отчётное видео</h2>
                <video controls>
                    <source src="PICK_D2.mp4" type="video/mp4">

                </video>
            </div>

            <!-- Видео 4 -->

                <h2>Полина Денисова | "Вопрос-ответ"</h2>

                    <source src="PD_D1.mp4" type="video/mp4">

                </video>
            </div>

        </div>
    </div>

</body>
</html>
